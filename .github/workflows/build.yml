name: Build KCM

on:
  push:
    branches: [master]
    paths:
      - 'kcm/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'kcm/**'

jobs:
  build-arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm cmake extra-cmake-modules gcc make qt6-base qt6-declarative kcmutils kconfig kcoreaddons

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S kcm -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

  build-fedora:
    name: Fedora 41
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install dependencies
        run: dnf install -y cmake extra-cmake-modules gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kcmutils-devel kf6-kconfig-devel kf6-kcoreaddons-devel

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S kcm -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

  build-ubuntu:
    name: Ubuntu 24.04
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Enable repos and install dependencies
        run: |
          apt-get update
          apt-get install -y software-properties-common gpg-agent
          add-apt-repository -y universe
          add-apt-repository -y ppa:kubuntu-ppa/ppa
          apt-get update
          echo "=== KF6 packages available ==="
          apt-cache search kf6 | grep -E '(kcm|kconfig|coreaddons)' | sort
          echo "=============================="
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake extra-cmake-modules g++ \
            qt6-base-dev qt6-declarative-dev \
            libkf6kcmutils-dev libkf6config-dev libkf6coreaddons-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S kcm -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel
