name: Build KCM

on:
  push:
    branches: [master]
    paths:
      - 'kcm/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'kcm/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            container: archlinux:latest
            install: pacman -Syu --noconfirm cmake extra-cmake-modules gcc qt6-base qt6-declarative kcmutils kconfig kcoreaddons

          - name: Fedora 41
            container: fedora:41
            install: dnf install -y cmake extra-cmake-modules gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kcmutils-devel kf6-kconfig-devel kf6-kcoreaddons-devel

          - name: Ubuntu 24.04
            container: ubuntu:24.04
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              cmake extra-cmake-modules g++
              qt6-base-dev qt6-declarative-dev
              libkf6kcmutils-dev libkf6config-dev libkf6coreaddons-dev

    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    steps:
      - name: Install dependencies
        run: ${{ matrix.install }}

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S kcm -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel
