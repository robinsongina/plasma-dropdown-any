name: Validate

on:
  push:
    branches: [master]
    paths:
      - 'plasmoid/**'
      - 'install.sh'
      - 'uninstall.sh'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'plasmoid/**'
      - 'install.sh'
      - 'uninstall.sh'
      - '.github/workflows/build.yml'

jobs:
  validate:
    name: shellcheck + JSON + qmllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y shellcheck qml6-l10n

      - name: shellcheck — config-helper.sh
        run: shellcheck plasmoid/contents/code/config-helper.sh

      - name: shellcheck — install.sh
        run: shellcheck install.sh

      - name: shellcheck — uninstall.sh
        run: shellcheck uninstall.sh

      - name: Validate metadata.json
        run: python3 -c "import json, sys; json.load(open('plasmoid/metadata.json')) or sys.exit(0); print('metadata.json: OK')"

      - name: qmllint — QML files (best-effort)
        run: |
          if command -v qmllint6 >/dev/null 2>&1; then
            find plasmoid/contents/ui -name '*.qml' -exec qmllint6 {} \;
          elif command -v qmllint >/dev/null 2>&1; then
            find plasmoid/contents/ui -name '*.qml' -exec qmllint {} \;
          else
            echo "qmllint not available — skipping QML syntax check"
          fi
